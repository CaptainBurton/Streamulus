name: Android APK

# Builds an installable APK of the Android app on GitHub's runners, which have the
# Android SDK, and attaches it to the run as a downloadable artifact. Nothing is
# committed back to the repository.
#
# Run it by hand with a release tag (e.g. v1.4) to also put the APK in a draft
# GitHub release with that tag — add the iOS / Apple TV builds there, then publish.
#
# Signing: with the repository secrets ANDROID_KEYSTORE_BASE64 and
# ANDROID_KEYSTORE_PASSWORD set, every APK is signed with the same key, so a new one
# installs over the old one. Without them it falls back to a throwaway debug key
# (then you'd have to uninstall before installing a newer build).
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also attach the APK to a draft release with this tag (e.g. v1.4) — leave empty for just the artifact'
        required: false
        default: ''
  push:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only used to create / update the draft release
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/streamulus-release.jks"
            echo "STREAMULUS_KEYSTORE_FILE=$RUNNER_TEMP/streamulus-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the Streamulus release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — this APK uses a throwaway key and won't install over other builds."
          fi

      - name: Build the APK
        env:
          STREAMULUS_BUILD_NUMBER: ${{ github.run_number }}
          STREAMULUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STREAMULUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STREAMULUS_KEY_ALIAS: streamulus
        run: ./gradlew --no-daemon assembleRelease

      - name: Name it
        run: cp app/build/outputs/apk/release/app-release.apk "Streamulus-Android-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Streamulus-Android-1.0.${{ github.run_number }}
          path: mobile/android/Streamulus-Android-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach to a draft release
        if: ${{ inputs.release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
          APK: Streamulus-Android-1.0.${{ github.run_number }}.apk
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Streamulus $TAG" \
              --notes "Android: $APK — installs over earlier Streamulus APKs. Add the iPhone / Apple TV builds here, then publish."
          fi
          gh release upload "$TAG" "$APK" --clobber
          echo "Added $APK to the draft release $TAG: ${{ github.server_url }}/${{ github.repository }}/releases"
