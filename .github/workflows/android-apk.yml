name: Android APK

# Builds an installable (debug-signed) APK of the Android app on GitHub's runners,
# which have the Android SDK, and attaches it to the run as a downloadable
# artifact. Nothing is committed back to the repository.
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name it
        run: cp app/build/outputs/apk/debug/app-debug.apk "Streamulus-Android-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Streamulus-Android-apk
          path: mobile/android/Streamulus-Android-*.apk
          if-no-files-found: error
          retention-days: 30
