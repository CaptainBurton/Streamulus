services:
  streamulus:
    build:
      context: https://github.com/CaptainBurton/Streamulus.git#claude/laughing-hopper-fX8qI
      dockerfile: Dockerfile
    container_name: streamulus
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      # Persistent app data (database, config)
      - streamulus_data:/data
      # Media is mounted at the same path inside the container as on the server,
      # so library paths in Admin > Libraries match the server's real folders
      # (e.g. /mnt/series-movies/Series).
      - /mnt/series-movies:/mnt/series-movies
    environment:
      - NODE_ENV=production
      - PORT=8096
      - DATA_DIR=/data
      # Change this to a strong random secret!
      - JWT_SECRET=change-me-to-a-strong-random-secret
volumes:
  streamulus_data:
    driver: local
