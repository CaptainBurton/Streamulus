services:
  streamulus:
    build:
      context: https://github.com/CaptainBurton/Streamulus.git#claude/laughing-hopper-fX8qI
      dockerfile: Dockerfile
    # Rebuild from the latest code on every deploy / redeploy. Without this,
    # Portainer reuses the image it built the first time and updates never arrive.
    pull_policy: build
    container_name: streamulus
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      # Persistent app data (database, config)
      - streamulus_data:/data
      # Your media folders. The right-hand side is fixed: in the app, libraries
      # are always /tv and /movies. Set the host folders with the TV_PATH and
      # MOVIES_PATH environment variables (Portainer: stack > Environment variables).
      - ${TV_PATH:-/mnt/movies-series/Series}:/tv
      - ${MOVIES_PATH:-/mnt/movies-series/Movies}:/movies
    environment:
      - NODE_ENV=production
      - PORT=8096
      - DATA_DIR=/data
      # Optional: your own sign-in secret (32+ random characters) as a JWT_SECRET
      # environment variable in Portainer. Left empty, Streamulus makes a random
      # one and keeps it in the data volume.
      - JWT_SECRET=${JWT_SECRET:-}
volumes:
  streamulus_data:
    driver: local
