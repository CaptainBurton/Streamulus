[versions]
agp = "8.11.0"
kotlin = "2.2.0"
composeBom = "2025.05.00"
activityCompose = "1.10.1"
coreKtx = "1.15.0"
media3 = "1.6.1"
appcompat = "1.7.0"
mediarouter = "1.7.0"
